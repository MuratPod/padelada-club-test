<div id="root"></div>
<script src="paddy.js"></script><script src="app.js"></script><script src="notes.js"></script>
<script>
const q=new URLSearchParams(location.search);
if(q.get('solo')){document.body.className='solo '+(q.get('t')||'light');const v=q.get('v')||'chats',d=+(q.get('d')??1),t=q.get('t')||'light';root.innerHTML=R[v](d,t,q.get('se')==='1');}
else{
 let d=+(q.get('d')??1),t=q.get('t')||'light';
 function draw(){const n=NOTES[d];
  root.innerHTML=`<div class="page"><h2>Как вписать Paddy в мир карточек</h2>
  <p class="lead">Язык карточек Padelada: тёплый «туманный» фон из коралла, манго и мяты; белые полупрозрачные карточки с радиусом 24–28 и очень мягкой тёплой тенью без контуров; живые круглые фото людей с дневным светом и размытым фоном; стекло только у навигации (панель, круглые кнопки, линза «Чатов») с бликом и размытием. Плоский Paddy с толстым контуром тут единственный «нарисованный» объект без света и глубины. Поэтому все направления добавляют ему свет, материал или рамку фотографии. Все кадры ниже — живой вектор на частях PoC (без filter, без анимации d): анимация 107 остаётся, к частям добавляются только статичные слои.</p>
  <div class="ctl">${[1,2,3,4,0].map(i=>`<button class="${i===d?'on':''}" onclick="d=${i};draw()">${R.NAMES[i]}</button>`).join('')}
  <span style="width:16px"></span><button class="${t==='light'?'on':''}" onclick="t='light';draw()">Светлая</button><button class="${t==='dark'?'on':''}" onclick="t='dark';draw()">Тёмная</button></div>
  <div class="stage"><div><div class="frame">${R.chats(d,t)}</div><div class="lang">Чаты · блок 160 / фигура 104 · iPhone 17</div></div>
  <div><div class="frame">${R.chat(d,t)}</div><div class="lang">Чат с Paddy · шапка #840</div></div>
  <div><div class="frame">${R.card(d,t)}</div><div class="lang">Карточка Paddy · #840</div></div>
  <div><div class="frame">${R.chats(d,t,1)}</div><div class="lang">SE · блок 132 / фигура 80</div><div class="frame" style="margin-top:20px">${R.card(d,t,1)}</div><div class="lang">SE · карточка</div></div></div>
  <div class="stage"><div><div class="pf" style="width:402px;height:402px"><div style="transform:scale(.67);transform-origin:0 0">${R.portrait(d,t)}</div></div><div class="lang">Крупный портрет</div></div>
   <div class="notes" style="width:820px"><h3>${n.h}</h3><p>${n.fit}</p><h4>Какие слои добавляются к частям</h4><p>${n.layers}</p><h4>Анимированные группы</h4><p>${n.groups}</p><h4>Производительность</h4><p>${n.perf}</p><h4>Плюсы</h4><ul>${n.plus.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Минусы</h4><ul>${n.minus.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Трудоёмкость</h4><p>${n.work}</p><h4>Риски (тёмная тема, 80 pt на SE)</h4><p>${n.risk}</p></div></div>
  <div class="textcard"><h3>Рекомендация</h3><p><b>Рекомендация: материал направления 1 (объёмный вектор) плюс подача направления 4 (Paddy как человек).</b> Над списком чатов остаётся живая фигура PoC (104 / SE 80) с объёмными слоями. В шапке #840, в карточке Paddy и в индикаторе «печатает» Paddy — круглый портрет головы на тёплом «фото»-фоне, как у людей. Сцену корта из направления 2 берём для приветствия и пустых состояний. Стекло (3) не берём: хуже читается, а блюр под живой анимацией стоит батареи.</p>
<p><b>Для 107:</b> PoC остаётся включённым. В parts.tsx, Hand и Ball добавляются статичные слои направления 1 (≈ +24 узла, 8 градиентов), а контур 7 заменяется тонким коралловым. В тёмной теме второй проход обводки выключается и ставится подсветка края. Аватар = поддерево головы (8 групп), анимировано только моргание в шапке. Работы на 1,5–2 дня. <b>Для 108:</b> упрощённый набор слоёв для размеров меньше 40, сцена корта для приветствия, тень на полу как отдельная группа для прыжка, замер fps и батареи на iPhone SE и Android.</p>
<h3>Черновик спеки (1 + 4)</h3>
<p><b>Аватар.</b> Размеры 26 (печатает), 40 (шапка #840), 52 (строка списка), 128 / SE 104 (карточка). Голова Paddy (viewBox 92 40 216 216) в материале направления 1 на фоне «фото»: radial #FFF6E8 → #F7B98E плюс 3 боке-пятна; в тёмной теме #3B2E45 → #141224. Кольцо conic коралл → манго → лайм → мята, 2 pt от 40, без кольца на 26. Точка «в сети» мятная от 52. Живое только моргание в шапке; в списке и у пузырей статика; Reduce Motion — статика.</p>
<p><b>Шапка.</b> Как в #840: капсула 56, радиус 28, стекло навигации. Аватар 40, «Paddy» Montserrat 800 17, подпись Golos 13 muted «Помощник и всему голова», чип «ИИ» с контуром 1,5. Справа круглые «домой» и «⋯» 46. Тап по капсуле открывает «Карточку Paddy»: тёплая карточка radial #FFC487 → #F7914A → #EA7A3B, верхний внутренний свет, тёплая тень 0 18 40 / 28%, портрет 128 с белым кольцом.</p>
<p><b>Пузыри.</b> Ответы Paddy выглядят так же, как сообщения людей: поверхность #FFFFFF / #141C30, радиус 22, мягкая тень, без контура и без цвета Paddy. В личном чате у пузырей нет аватара (как у людей). Индикатор «печатает»: аватар 26 плюс точки плюс статус («Paddy ищет корт…» для busy/search). В групповых чатах аватар 28 у последнего пузыря серии, как у людей. Коралл только у кнопок действий.</p>
<p><b>Не проверено:</b> на устройстве ничего не запускалось, кадры — браузерный вектор с той же геометрией, что в PoC. Число узлов посчитано по макету, fps и батарея не мерились. Растровые рендеры в renders/ — только референс света, а не ассет. backdrop-filter в браузере ≠ BlurView/GlassView на Android.</p></div></div>`}
 draw();
}
</script></body></html>
