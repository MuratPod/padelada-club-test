<script>
const q=new URLSearchParams(location.search);
if(q.get('solo')){document.body.className='solo '+(q.get('t')||'light');const v=q.get('v')||'chats',d=+(q.get('d')??1),t=q.get('t')||'light';root.innerHTML=R[v](d,t);}
else{
 let d=+(q.get('d')??1),t=q.get('t')||'light';
 function draw(){const n=NOTES[d];
  root.innerHTML=`<div class="page"><h2>Как вписать Paddy в мир карточек</h2>
  <p class="lead">Язык карточек Padelada: тёплый «туманный» фон из коралла, манго и мяты; белые полупрозрачные карточки с радиусом 24–28 и очень мягкой тёплой тенью без контуров; живые круглые фото людей с дневным светом и размытым фоном; стекло только у навигации (панель, круглые кнопки, линза «Чатов») с бликом и размытием. Плоский Paddy с толстым контуром тут единственный «нарисованный» объект без света и глубины. Поэтому все направления добавляют ему свет, материал или рамку фотографии.</p>
  <div class="ctl">${[1,2,3,4,0].map(i=>`<button class="${i===d?'on':''}" onclick="d=${i};draw()">${R.NAMES[i]}</button>`).join('')}
  <span style="width:16px"></span><button class="${t==='light'?'on':''}" onclick="t='light';draw()">Светлая</button><button class="${t==='dark'?'on':''}" onclick="t='dark';draw()">Тёмная</button></div>
  <div class="stage"><div><div class="frame">${R.chats(d,t)}</div><div class="lang">Чаты · 402×874 · ru</div></div>
  <div><div class="frame">${R.chat(d,t)}</div><div class="lang">Чат с Paddy · шапка А+В</div></div>
  <div><div class="pf" style="width:402px;height:402px"><div style="transform:scale(.67);transform-origin:0 0">${R.portrait(d,t)}</div></div><div class="lang">Крупный портрет</div>
   <div class="notes" style="width:402px;margin-top:16px"><h3>${n.h}</h3><p>${n.fit}</p><h4>Плюсы</h4><ul>${n.plus.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Минусы</h4><ul>${n.minus.map(x=>`<li>${x}</li>`).join('')}</ul><h4>Живая анимация</h4><p>${n.anim}</p><h4>Трудоёмкость</h4><p>${n.work}</p><h4>Риски</h4><p>${n.risk}</p></div></div></div>
  <div class="textcard"><h3>Рекомендация</h3><p><b>Комбинация 1 + 4: объёмный Paddy как единый персонаж и круглый портрет-аватар «как у людей».</b> В списке чатов, шапке и у сообщений Paddy выглядит как контакт с фото. Над списком остаётся живая объёмная фигура на мягкой тени, при желании на стеклянной подставке из направления 3 (expo-glass-effect уже в приложении). Карточку-сцену из направления 2 оставляем для приветствия и пустых состояний.</p>
<p><b>Для 107:</b> портрет-аватар (по JPG на тему, 0,5–1 день) и объёмная фигура в блоке из 3 поз (привет, радость, думаю) PNG @3x. Движок PoC переиспользуется: дыхание, покачивание, прыжок радости, pull-down, Reduce Motion, пауза вне экрана, только целиком по картинке. Плоский SVG-Paddy в 107 не выпускаем. <b>Для 108:</b> 3D-модель с ригом, PNG-части для wave/look/blink/think/search на том же движке Reanimated, а toss/serve анимированным WebP через expo-image. Новых нативных зависимостей нет, замер батареи тоже в 108.</p>
<p><b>Не проверено:</b> рендеры сделаны генератором изображений, это эскизы направления, а не финальные ассеты. Позы между собой не совпадают на 100%: в «думаю» у варежки палец, в карточке-сцене кисть с пальцами. На устройстве ничего не запускалось, вес и батарея посчитаны оценочно. Мелкий размер (80 pt SE, аватар 32 pt) смотрел только в браузере.</p></div></div>`}
 draw();
}
