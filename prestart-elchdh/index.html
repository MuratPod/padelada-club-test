  --inverse:#24123A;--onInverse:#FFF1EA;--ink:#24123A;--inkMuted:#6E5E7A;--placeholder:#8B7E96;
  --inkOnNight:#FFF1EA;--inkOnNightMuted:#CDBFD6;--onBrand:#24123A;--inkAccent:#C03237;--inkMango:#AE4825;
  --line:#EBD8CF;--lineStrong:#8C6F86;--focusRing:#24123A;
  --success:#0B765A;--danger:#B0213E;--onDanger:#FFF1EA;--successSoft:#E7F8F2;--successSoftInk:#0E6B53;
  --avatar1:#FFA62B;--avatar2:#3DDBB0;--avatar3:#FF5E5B;--avatar4:#82C7D9;
  --tintCoral:#FFE4E2;--tintMango:#FFF3E0;--tintMint:#DFF7EF;
  --headerButton:rgba(255,255,255,0.7);--headerButtonShadow:0 0 0 1px rgba(36,18,58,0.5),0 2px 8px rgba(36,18,58,0.14);--headerIcon:#24123A;
  --tabBar:#FFFBF8;--segmentOn:#FFFFFF;--segmentTrack:#FBE3D8;
  --shadowCard:0 8px 22px rgba(36,18,58,0.09);--shadowCoral:0 8px 20px rgba(255,94,91,0.30);
  --bubble:#FFFFFF;
  --r-sm:10px;--r-md:16px;--r-lg:28px;--r-xl:36px;--r-pill:999px;
  --fd:'Montserrat Alternates','Montserrat',sans-serif;--ft:'Golos Text',system-ui,sans-serif;
}
.dark{
  --bg:#0A1124;--surface:#141C30;--surfaceSunk:#232C45;--surfaceNight:#141C30;
  --inverse:#F5F5F7;--onInverse:#0B0C0E;--ink:#F5F5F7;--inkMuted:#A8AAB2;--placeholder:#8E9098;
  --inkOnNight:#F5F5F7;--inkOnNightMuted:#A8AAB2;--inkAccent:#FFB547;--inkMango:#FFA62B;
  --brandMint:#4BE3BA;
  --line:#3A3B40;--lineStrong:#7C7E86;--focusRing:#FFA62B;
  --success:#6FE0BE;--danger:#FF8498;--onDanger:#24123A;--successSoft:#1F3A33;--successSoftInk:#9CF0D6;
  --avatar2:#4BE3BA;--avatar3:#FF6F6C;
  --tintCoral:#3A2A2C;--tintMango:#3A3228;--tintMint:#1F3A33;
  --headerButton:#141C30;--headerButtonShadow:0 0 0 1px rgba(255,255,255,0.16);--headerIcon:#F5F5F7;
  --tabBar:#141C30;--segmentOn:#3F4046;--segmentTrack:#232C45;
  --shadowCard:0 8px 22px rgba(0,0,0,0.45);--shadowCoral:none;--bubble:#141C30;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--ft);background:#E9E4EC;color:#24123A;-webkit-font-smoothing:antialiased;overflow:hidden}
body.dark{background:#05080F}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
textarea{font:inherit;color:inherit}
.dc{font-family:'Montserrat',sans-serif}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i24{width:24px;height:24px}.i14{width:14px;height:14px}.i22{width:22px;height:22px}

/* ---------- сцена: рамка / телефон / bare ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:32px;padding:16px}
.phone{position:relative;width:410px;height:864px;border-radius:58px;border:10px solid #15101d;background:#15101d;box-shadow:0 30px 80px rgba(36,18,58,.3);flex:none;overflow:hidden}
.phone .app{border-radius:48px}
body.mobile .stage,body.bare .stage{padding:0;display:block}
body.mobile .phone,body.bare .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.mobile .phone .app,body.bare .phone .app{border-radius:0}
.app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/22px var(--ft);overflow:hidden}
.status{height:59px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 10px 38px;font:700 16px/20px var(--ft)}
.status .sb{display:flex;gap:6px;align-items:center}
body.mobile .status{display:none}
.mstrip{display:none}
body.mobile .mstrip{display:flex;height:calc(env(safe-area-inset-top,0px) + 40px);flex:none;align-items:flex-end;justify-content:center;padding-bottom:4px}
.demo-btn{height:32px;padding:0 14px;border-radius:999px;background:var(--surfaceSunk);color:var(--ink);font:700 13px/18px var(--ft);display:flex;align-items:center;gap:6px;border:1.5px solid var(--lineStrong)}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);pointer-events:none;z-index:50}
body.mobile .home{display:none}
body.bare .demo-btn,body.bare .mstrip,body.bare .panel{display:none}

/* ---------- панель демо ---------- */
.panel{width:300px;background:#fff;color:#24123A;border-radius:28px;padding:20px;box-shadow:0 12px 40px rgba(36,18,58,.12);max-height:864px;overflow:auto;font:400 14px/20px var(--ft)}
body.dark .panel{background:#141C30;color:#F5F5F7}
.panel h3{font:800 15px/20px 'Montserrat',sans-serif;margin-bottom:4px}
.panel .sub{color:#6E5E7A;font-size:13px;line-height:18px;margin-bottom:12px}
body.dark .panel .sub{color:#A8AAB2}
.panel .grp{margin-top:14px}
.panel .lab{font:700 12px/14px var(--ft);letter-spacing:1.4px;text-transform:uppercase;color:#6E5E7A;margin-bottom:6px}
body.dark .panel .lab{color:#A8AAB2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;background:#FBE3D8;color:#24123A;font:500 13px/18px var(--ft);border:1.5px solid transparent}
body.dark .chip{background:#232C45;color:#F5F5F7}
.chip.on{background:#24123A;color:#FFF1EA}
body.dark .chip.on{background:#F5F5F7;color:#0B0C0E}
body.mobile .panel{position:fixed;left:8px;right:8px;bottom:8px;width:auto;max-height:72vh;z-index:300;display:none;box-shadow:0 12px 60px rgba(0,0,0,.4)}
body.mobile.panel-open .panel{display:block}
body.mobile .chip{min-height:44px}

/* ---------- общие элементы ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;flex:none}
.circ{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--headerButton);box-shadow:var(--headerButtonShadow);color:var(--headerIcon)}
.ttl{flex:1;min-width:0}
.ttl h1{font:800 24px/28px var(--fd);color:var(--ink);overflow-wrap:anywhere}
.ttl p{font:500 13px/18px var(--ft);color:var(--inkMuted)}
.pill{min-height:48px;padding:12px 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/18px var(--ft);text-align:center}
.pill.pri{background:var(--brandCoral);color:var(--onBrand);box-shadow:var(--shadowCoral)}
.pill.inv{background:var(--inverse);color:var(--onInverse)}
.pill.out{border:2px solid var(--lineStrong);color:var(--ink);padding:10px 14px}
.pill.grey{background:var(--surfaceSunk);color:var(--inkMuted)}
.pill.cta{min-height:56px;font-size:17px;line-height:22px}
.pill:disabled{cursor:default}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 13px/18px var(--ft)}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 15px/18px var(--ft);color:var(--onBrand)}
.a1{background:var(--avatar1)}.a2{background:var(--avatar2)}.a3{background:var(--avatar3)}.a4{background:var(--avatar4)}

/* ---------- чат ---------- */
.trpill{height:48px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--headerButton);box-shadow:var(--headerButtonShadow);color:var(--headerIcon);font:700 15px/18px var(--ft);flex:none}
.msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:0 16px 12px}
.mrow{display:flex;align-items:flex-end;gap:8px}
.mrow.own{justify-content:flex-end}
.bub{max-width:min(78%,300px);background:var(--bubble);border-radius:var(--r-md);padding:10px 14px 10px}
.bub.wide{max-width:calc(100% - 52px);width:calc(100% - 52px)}
.own .bub{background:var(--surfaceNight);color:var(--inkOnNight)}
.dark .own .bub{box-shadow:0 0 0 1px var(--line)}
.bub .nm{font:700 13px/18px var(--ft);color:var(--ink)}
.bub .tx{font:400 17px/26px var(--ft)}
.bub .cap{font:500 13px/18px var(--ft);color:var(--inkMuted);margin-top:2px}
.own .bub .cap{color:var(--inkOnNightMuted)}
.bub .cap b{color:var(--inkAccent);font-weight:700}
.vrow{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.vplay{width:48px;height:48px;border-radius:50%;background:var(--brandCoral);color:var(--onBrand);display:flex;align-items:center;justify-content:center;flex:none}
.vplay.off{background:var(--surfaceSunk);color:var(--inkMuted)}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:32px;min-width:0}
.wave i{display:block;width:3px;border-radius:2px;background:var(--lineStrong)}
.vtime{font:700 13px/18px var(--ft);color:var(--ink)}
.sep{border-top:1px solid var(--line);margin:8px 0 6px;padding-top:6px}
.ov{font:700 12px/14px var(--ft);letter-spacing:1.44px;text-transform:uppercase;color:var(--inkMuted)}
.sep .tx{font:400 15px/22px var(--ft);margin-top:2px}
.sep .tx.it{font-style:italic;color:var(--inkMuted)}
.listen{margin-top:8px;width:100%}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--tintMango);font:500 13px/18px var(--ft);color:var(--ink)}
.note .i{color:var(--inkMango);margin-top:0}

/* поле ввода */
.comp{margin:0 16px 12px;background:var(--surface);border:1.5px solid var(--lineStrong);border-radius:var(--r-lg);padding:6px;flex:none;box-shadow:var(--shadowCard)}
.crow{display:flex;align-items:center;gap:6px}
.plus{width:48px;height:48px;border-radius:50%;background:var(--surfaceSunk);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.fld{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font:400 16px/22px var(--ft);color:var(--ink);padding:13px 4px;min-height:48px;display:block;overflow:hidden}
.fld::placeholder{color:var(--inkMuted);opacity:1}
.mic{width:48px;height:48px;border-radius:50%;background:var(--inverse);color:var(--onInverse);display:flex;align-items:center;justify-content:center;flex:none;touch-action:none}
.arow{display:flex;gap:8px;padding:6px 0 0}
.arow .pill{flex:1;min-width:0}
.arow .pill span{min-width:0}
.hint{margin:0 16px 8px;border-radius:var(--r-lg);background:var(--tintMango);padding:14px 16px;flex:none}
.hint .h{display:flex;gap:8px;align-items:flex-start;font:700 15px/20px var(--ft);color:var(--ink)}
.hint .h .i{color:var(--inkMango);margin-top:1px}
.hint p{font:400 15px/22px var(--ft);margin:4px 0 12px 28px;color:var(--ink)}
.hint .bt{display:flex;gap:8px;flex-wrap:wrap;margin-left:28px}
.hint .bt .pill{padding-left:14px;padding-right:14px}
/* запись */
.rec{display:flex;align-items:center;gap:12px;padding:2px 2px 2px 14px;min-height:60px}
.rec .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);flex:none}
.rec .tm{font:700 17px/22px var(--ft);font-variant-numeric:tabular-nums;flex:none}
.rec .sl{flex:1;font:500 13px/18px var(--ft);color:var(--inkMuted);min-width:0}
.micbig{width:56px;height:56px;border-radius:50%;background:var(--brandCoral);color:var(--onBrand);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadowCoral)}
.wave.live{height:24px;flex:none;width:72px}
/* диктовка */
.dict{padding:10px 10px 10px}
.dtop{display:flex;align-items:center;gap:8px;min-height:40px}
.dtop .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);flex:none}
.dtop b{font:700 15px/18px var(--ft);flex:1;min-width:0}
.sw{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 4px 0 8px;font:500 13px/18px var(--ft);color:var(--ink)}
.sw .tr{width:44px;height:26px;border-radius:13px;background:var(--inverse);position:relative;flex:none}
.sw .tr:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--onInverse)}
.dtx{font:400 17px/26px var(--ft);min-height:78px;padding:4px 4px 8px}
.caret{display:inline-block;width:2px;height:20px;background:var(--ink);vertical-align:-4px;margin-left:2px}
.dhint{font:500 13px/18px var(--ft);color:var(--inkMuted);padding:0 4px 10px}
.dbtn{display:flex;gap:8px}
.dbtn .pri{flex:1}
.errc{border-color:var(--danger);border-width:2px}
.err{display:flex;gap:12px;padding:10px 10px 4px}
.err .i{color:var(--danger);margin-top:2px}
.err b{display:block;font:700 15px/20px var(--ft)}
.err p{font:400 15px/22px var(--ft);color:var(--ink)}
/* таб-бар */
.tabs{margin:0 16px 40px;height:64px;border-radius:999px;background:var(--tabBar);box-shadow:var(--shadowCard);display:flex;align-items:center;justify-content:space-around;padding:0 6px;flex:none}
.dark .tabs{box-shadow:0 0 0 1px rgba(255,255,255,0.12),var(--shadowCard)}
.tab{height:52px;min-width:48px;padding:0 6px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 13px/14px var(--ft);color:var(--inkMuted);flex:1 1 0}
.tab span{display:block;max-width:100%}
.tab.on{background:var(--brandMango);color:var(--onBrand);flex:1.25 1 0}
.dark .tab{color:var(--inkOnNightMuted)}
.dark .tab.on{color:var(--onBrand)}
/* листы */
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:12px 16px 40px;box-shadow:0 -8px 32px rgba(0,0,0,.18)}
.dark .sheet{box-shadow:0 0 0 1px var(--line),0 -8px 32px rgba(0,0,0,.5)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--lineStrong);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-h h2{flex:1;font:800 22px/26px var(--fd);min-width:0}
.sh-h .circ{background:var(--surfaceSunk);box-shadow:none;color:var(--ink)}
.arowp{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 16px 8px 8px;border-radius:999px;background:var(--surfaceSunk);margin-bottom:8px;font:700 15px/18px var(--ft)}
.arowp .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.arowp .lb{flex:1;min-width:0}
.arowp.lock{color:var(--inkMuted)}
.arowp.lock .ic{background:var(--surface);color:var(--inkMuted)}
.t1{background:var(--tintCoral)}.t2{background:var(--tintMango)}.t3{background:var(--tintMint)}
.lockn{display:flex;gap:10px;align-items:flex-start;background:var(--tintMango);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font:500 14px/20px var(--ft)}
.lockn .i{color:var(--inkMango);margin-top:1px}
.lockn .pill{margin-top:10px}
.sbody{font:400 15px/22px var(--ft);margin-bottom:16px}
.toast{position:absolute;left:16px;right:16px;top:70px;z-index:80;background:var(--inverse);color:var(--onInverse);border-radius:var(--r-md);padding:12px 16px;font:500 14px/20px var(--ft);text-align:center}

/* ---------- №6 Plus ---------- */
.scr{flex:1;min-height:0;overflow:auto;padding:0 16px 16px}
.scr::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--brandMango);color:var(--onBrand);border-radius:999px;padding:4px 12px;font:700 13px/18px var(--ft)}
.hero h2{font:800 24px/28px var(--fd);margin:12px 0 8px;overflow-wrap:anywhere}
.hero p{font:400 17px/26px var(--ft)}
.hero .req{font:500 14px/20px var(--ft);color:var(--inkMuted);margin-top:8px;display:flex;gap:8px}
.seg{display:flex;background:var(--segmentTrack);border-radius:999px;padding:4px;margin:16px 0 12px}
.seg button{flex:1;min-height:48px;border-radius:999px;font:700 15px/18px var(--ft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.seg button.on{background:var(--inverse);color:var(--onInverse)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadowCard)}
.dark .card{box-shadow:0 0 0 1px var(--line)}
.tb-h{display:flex;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line);font:700 13px/18px var(--ft);color:var(--inkMuted)}
.tb-h .c1{flex:1}.tb-h .c2{width:48px;text-align:right}.tb-h .c3{width:104px;text-align:right;color:var(--ink)}
.rw{display:flex;align-items:center;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line);gap:4px}
.rw:last-child{border-bottom:0}
.rw .c1{flex:1;min-width:0}
.rw .c1 b{display:block;font:700 15px/20px var(--ft)}
.rw .c1 small{display:block;font:500 13px/18px var(--ft);color:var(--inkMuted)}
.rw .c2{width:48px;text-align:right;font:500 15px/20px var(--ft);color:var(--inkMuted);flex:none}
.rw .c3{width:104px;text-align:right;font:700 17px/22px var(--ft);flex:none}
.rw .c3 small{display:block;font:500 13px/18px var(--ft);color:var(--inkMuted)}
.rw .c3 .i{color:var(--success)}
.foot{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.ph{display:inline-flex;gap:6px;align-items:center;border:2px dashed var(--lineStrong);border-radius:999px;padding:6px 14px;font:700 13px/18px var(--ft)}
.phl{font:500 13px/18px var(--ft);color:var(--inkMuted)}
.bot{flex:none;padding:12px 16px 40px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bot .pill{width:100%}
.dash{border:2px dashed var(--lineStrong);border-radius:var(--r-lg);padding:16px}
.dash b{display:flex;gap:8px;font:700 15px/20px var(--ft);margin-bottom:4px}
.dash p{font:400 15px/22px var(--ft)}

/* ---------- №7 лимиты ---------- */
.lim{display:flex;flex-direction:column;gap:12px}
.lc{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px}
.dark .lc{box-shadow:0 0 0 1px var(--line)}
.lc .t{display:flex;align-items:flex-start;gap:12px}
.lc .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.lc .tt{flex:1;min-width:0}
.lc .tt b{display:block;font:700 15px/20px var(--ft)}
.lc .tt small{display:block;font:500 13px/18px var(--ft);color:var(--inkMuted)}
.st{display:inline-flex;align-items:center;gap:4px;font:700 13px/18px var(--ft);flex:none;padding:3px 10px;border-radius:999px;margin-top:1px}
.st.ok{background:var(--successSoft);color:var(--successSoftInk)}
.st.low{background:var(--tintMango);color:var(--ink)}
.st.low .i{color:var(--inkMango)}
.st.out{background:var(--surfaceSunk);color:var(--danger)}
.bar{margin-top:10px}
.bl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font:500 13px/18px var(--ft);color:var(--inkMuted)}
.bl b{font:700 15px/20px var(--ft);color:var(--ink);font-variant-numeric:tabular-nums}
.trk{height:12px;border-radius:6px;background:var(--surfaceSunk);margin-top:6px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:6px;background:var(--success)}
.trk.low i{background:var(--inkMango)}
.trk.out i{background:var(--danger)}
.rs{display:flex;align-items:center;gap:6px;font:500 13px/18px var(--ft);color:var(--inkMuted);margin-top:8px}
.rs.out{color:var(--ink);font-weight:700}
.planrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.lockbar{margin-top:10px;display:flex;align-items:center;gap:8px;font:500 14px/20px var(--ft);color:var(--inkMuted)}
.lockbar .trk{flex:1;margin:0}
.lcl{opacity:1}

.nw{white-space:nowrap}

.bar.stk .rs{margin-top:6px}
.bl .rs{margin:0;white-space:nowrap}
.bl{flex-wrap:wrap}
.rs.fn{padding:0 4px;align-items:flex-start}
.rs.fn .i{margin-top:2px;flex:none}

.tab.pdt .pdb{font-style:normal;position:absolute;top:-22px;left:50%;margin-left:-28px;width:56px;height:56px;border-radius:50%;border:4px solid var(--bg);background:var(--bg);box-shadow:var(--shadowCard);display:block}
.tab.pdt .pdb svg{width:100%;height:100%;display:block}
.tab.pdt.on .pdb{box-shadow:0 0 0 3px var(--brandMango)}
.tab.pdt.on{color:var(--ink);background:none}
.dark .tab.pdt.on{color:var(--inkOnNightMuted)}
/* анимации Ракетки: кивок (моргание — внутри SVG); выключены в prefers-reduced-motion и при съёмке */
@keyframes pnod{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-3deg)}86%{transform:rotate(2deg)}}
.pdhero svg,.ohead .pst svg,.wlc .pst svg{transform-origin:50% 88%;animation:pnod 4.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pdhero svg,.ohead .pst svg,.wlc .pst svg{animation:none}}
body.bare .pdhero svg,body.bare .ohead .pst svg,body.bare .wlc .pst svg,body.bare .blink{animation:none!important}
/* карточка действий */
.acard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadowCard);padding:12px;margin:4px 0 0}
.acard .ov{margin:0 4px 8px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.atile{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;border-radius:var(--r-md);background:var(--surfaceSunk);color:var(--ink);font:700 14px/18px var(--ft);text-align:left}
.atile .i{flex:none;color:var(--inkAccent)}
.atile span{min-width:0}
.wlc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin:0 0 4px}
.wlc .pst{width:128px;height:128px}
.wlc h2{font:800 24px/28px var(--fd);color:var(--ink)}
.wlc p{font:500 13px/18px var(--ft);color:var(--inkMuted);margin:0}
.ctxc{align-self:center;display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:999px;background:var(--surfaceSunk);font:500 13px/18px var(--ft);color:var(--inkMuted)}
.ctxc b{color:var(--ink)}

/* ---- правки 6 ---- */
.stkbar{display:flex;justify-content:space-between;gap:4px;margin:-4px 0 12px}
.stkr{flex:0 0 56px;height:56px;border-radius:var(--r-md);background:var(--surfaceSunk);display:flex;align-items:center;justify-content:center}
.stkr.on{background:var(--tintCoral);box-shadow:inset 0 0 0 1.5px var(--inkAccent)}
.stkr .pst,.stkb .pst{display:block}
.stkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stkb{aspect-ratio:1;border-radius:var(--r-lg);background:var(--surfaceSunk);display:flex;align-items:center;justify-content:center;min-height:88px}
.stkb .pst{width:72px;height:72px}
.rx .pst{display:inline-block;flex:none}
.poff{position:relative;margin-top:8px}
.poff .vtag{margin-bottom:8px;white-space:normal;text-align:left;border-radius:var(--r-md)}
.pofh{display:flex;gap:8px;align-items:center;font:800 16px/20px var(--fd);color:var(--ink)}
.pofh .i{color:var(--inkAccent);flex:none}
.poff p{font:400 14px/20px var(--ft);color:var(--ink);margin:6px 0 12px}
.poff .pill{width:100%}
.dcard{background:var(--surfaceSunk);border-radius:var(--r-md);padding:12px;margin-top:8px}
.dch{display:flex;gap:8px;align-items:center;margin-bottom:6px;font:700 14px/18px var(--ft);color:var(--inkMuted)}
.dcard .rmn{display:flex;gap:6px;align-items:center;margin-top:8px}
.dact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dact .pri{flex:1 1 100%}
.dact .out{flex:1 1 0;min-width:0;padding-left:10px;padding-right:10px}
.dact.col .out,.dact.col .pri{flex:1 1 100%}
.dgh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.dgh b{display:block;font:800 16px/20px var(--fd)}
.dgh small{display:block;font:500 13px/18px var(--ft);color:var(--inkMuted)}
.dgk{padding:4px 12px;margin-top:4px;background:var(--surfaceSunk);box-shadow:none}
.gate{padding-top:8px}
.gate .odots{margin:4px 0 16px}
.gh h1{font:800 28px/32px var(--fd);color:var(--ink);overflow-wrap:anywhere}
.gh p{font:400 17px/26px var(--ft);color:var(--ink);margin:8px 0 16px}
.gate .opts{display:flex;flex-direction:column;gap:8px}
.gic{width:72px;height:72px;border-radius:50%;background:var(--surfaceSunk);display:flex;align-items:center;justify-content:center;margin:16px 0;color:var(--ink)}
.hcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadowCard);padding:16px;margin:8px 0 12px;display:flex;flex-direction:column;gap:12px}
.dark .hcard{box-shadow:0 0 0 1px var(--line)}
.hcard .pill{width:100%}
.hnone{display:flex;gap:12px;align-items:flex-start}
.hnone b{display:block;font:800 16px/20px var(--fd)}
.hnone p{font:400 14px/20px var(--ft);color:var(--inkMuted);margin:4px 0 0}
.hcat small{display:block;font:500 13px/18px var(--ft);color:var(--inkMuted)}

/* ---- кнопка Paddy в таб-баре: варианты A/B/C, без подписи ---- */
.tab.pdt{justify-content:center;padding:0}
.tab.pdt .pl{display:none}
.tabs.mvA .tab.pdt .pdb{width:68px;height:68px;margin-left:-34px;top:-30px;border:4px solid var(--bg);background:var(--tintCoral);box-shadow:var(--shadowCard);padding:4px 0 0}
.tabs.mvA .tab.pdt .pdb svg{width:100%;height:100%}
.tabs.mvB .tab.pdt .pdb{width:64px;height:78px;margin-left:-32px;top:-38px;border:0;border-radius:0;background:none;box-shadow:none}
.tabs.mvB .tab.pdt .pdb svg{width:100%;height:100%}
.tabs.mvC .tab.pdt .pdb{width:64px;height:64px;margin-left:-32px;top:-26px;border:5px solid var(--bg);background:var(--tintCoral);box-shadow:var(--shadowCard);padding:3px}
.tabs.mvC .tab.pdt .pdb svg{width:100%;height:100%}
.tab.pdt.on .pdb{box-shadow:0 0 0 3px var(--brandMango)}
.tabs.mvB .tab.pdt.on .pdb{box-shadow:none}
.tabs.mvB .tab.pdt.on::after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-12px;width:24px;height:4px;border-radius:2px;background:var(--brandMango)}

.poffi{margin-top:10px;padding:12px;border-radius:var(--r-md);background:var(--surfaceSunk)}
.poffi .pofh{font:800 15px/20px var(--fd)}
.poffi p{font:400 14px/20px var(--ft);color:var(--ink);margin:4px 0 10px}
.poffi .pill{width:100%}
.ctxc.vtag{white-space:normal;text-align:center;background:var(--tintMango);color:var(--ink);border-radius:var(--r-md);padding:6px 12px}
.acard.cmp .ov{display:none}.acard.cmp .atile{min-height:48px}.acard.cmp{padding:8px}
.poffi{margin-top:8px}
.lmstat.cmp em{display:none}
.ctxc{flex:none}
.poffi{padding:8px 10px}.poffi .pill{min-height:48px;height:48px}.poffi p{margin:2px 0 8px}.acard.cmp .agrid{gap:6px}.acard.cmp{margin-top:0}
.shotph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:120px;border-radius:var(--r-md);background:var(--surfaceSunk);color:var(--inkMuted);font:500 13px/18px var(--ft);margin-bottom:8px;border:2px dashed var(--lineStrong)}
.rmn .i{vertical-align:-2px}

/* меню D/E/F (правки 7): D — овальная кнопка с маленьким Paddy, E — овальная кнопка с текстом, F — обычная вкладка */
.tabs.mvD,.tabs.mvE{gap:2px}
.tab.pdp{flex:1.4 1 0;min-width:64px;max-width:96px;height:48px;border-radius:999px;background:var(--brandCoral);color:var(--onBrand);box-shadow:var(--shadowCoral);padding:0 8px;flex-direction:row;border:0;cursor:pointer}
.tab.pdp.on{background:var(--brandCoral);color:var(--onBrand);flex:1.4 1 0;box-shadow:0 0 0 3px var(--tabBar),0 0 0 5px var(--ink)}
.tab.pdp .pdb{font-style:normal;display:block;height:40px;width:34px}
.tab.pdp .pdb svg{display:block;width:100%;height:100%}
.tab.pdE span{font:800 16px/20px var(--fd);letter-spacing:0;white-space:nowrap}
.tab.pdf{border:0;background:none;cursor:pointer}
.tab.pdf.on{background:var(--brandMango);color:var(--onBrand);flex:1.25 1 0}
.tabs.mvD,.tabs.mvE,.tabs.mvF{padding:0 4px;gap:0}
.tabs.mvD .tab,.tabs.mvE .tab,.tabs.mvF .tab{padding:0 1px;min-width:0}
.tabs.mvD .tab.pdp,.tabs.mvE .tab.pdp{flex:0 0 68px;min-width:68px;max-width:68px;padding:0}
.tabs.mvD .tab.pdp .pdb{height:38px;width:32px}
.tabs.mvD .tab,.tabs.mvE .tab,.tabs.mvF .tab{font-size:12px;line-height:14px}
.tabs.mvD .tab.pdp,.tabs.mvE .tab.pdp{flex-basis:64px;min-width:64px;max-width:64px}
.tab.pdE span{font:800 16px/20px var(--fd)}

/* состояния Paddy (правки 7): пауза, выключено, нет сети, жалоба на ответ */
.stic{width:48px;height:48px;border-radius:50%;background:var(--surfaceSunk);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.phn{display:flex;gap:6px;align-items:flex-start;margin:8px 4px 0;font:400 13px/18px var(--ft);color:var(--inkMuted)}
.phn .i{flex:none;margin-top:2px}
.offv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 16px}
.offv h2{font:800 24px/28px var(--fd);color:var(--ink)}
.offv p{font:400 16px/24px var(--ft);color:var(--ink);margin:0}
.offv .phn{justify-content:center;font-size:13px}
.sbn.net{background:var(--tintMango)}
.sbn.net .bt .pill{flex:1 1 100%}
.rpn{font:400 13px/18px var(--ft);color:var(--inkMuted);margin:12px 0 8px}
.rps{font:700 18px/24px var(--ft);color:var(--ink)}
.sheet .phn{margin-top:12px}

/* F1…F5: исполнение центральной вкладки «Paddy» */
.tabs.mvF{padding:0 4px;gap:0}
.tab{transition:background-color .18s ease,color .18s ease,transform .12s ease}
.tab:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.tab{transition:none}.tab:active{transform:none}}
.tabs.mvF4 .tab.pdf,.tabs.mvF5 .tab.pdf{--pd-head:var(--brandCoral);--pd-face:var(--onBrand)}
.tabs.mvF4 .tab.pdf.on,.tabs.mvF5 .tab.pdf.on{--pd-head:var(--inkOnNight);--pd-face:var(--onBrand)}
.tabs.mvF3 .tab.on{height:48px}
.tabs.mvF5 .tab.on{background:none;color:var(--ink);flex:1 1 0}
.dark .tabs.mvF5 .tab.on{color:var(--inkOnNight)}
.tabs.mvF5 .tab .i{width:52px;height:30px;box-sizing:border-box;padding:4px 15px;border-radius:999px;transition:background-color .18s ease}
.tabs.mvF5 .tab.on .i{width:52px;height:30px;box-sizing:border-box;padding:4px 15px;border-radius:999px;background:var(--brandMango);color:var(--onBrand)}
.tabs.mvF5 .tab.pdf.on{--pd-head:var(--inkOnNight)}
.tabs.mvF5 .tab.on{gap:2px}
/* Paddy в полный рост: эмоции */
.pe{display:inline-block;flex:none}
.pe>svg{width:100%;height:100%;display:block}
.mrow.emo1{align-items:flex-end;gap:4px}
.mrow.emo1 .pf{margin-bottom:-4px}
.emo2{display:flex;justify-content:center;margin:4px 0 -2px}
.mrow.emo2r{justify-content:flex-start}
.mrow.emo3 .pk{margin-left:2px}
.mrow.cont{padding-left:52px}
.mrow.emo3{align-items:flex-end}
.pbig.pp1{flex-direction:row;align-self:stretch;align-items:center;gap:8px;padding:4px 16px 8px;text-align:left;position:relative;width:100%}
.pbig.pp1 .pt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.pbig.pp1 small,.pbig.pp2 small{font:400 14px/20px var(--ft);color:var(--inkMuted);display:block}
.pbig.pp1 .bdg{position:static;margin-left:auto}
.pbig.pp2 .pc{width:112px;height:112px;border-radius:0}
.pbig.pp2 .pc .bdg{position:absolute;top:4px;right:-6px}
.pbig.pp3 .ppv{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:20px;padding:4px 14px 4px 6px;box-shadow:var(--shadowCard)}
.pbig.pp3 .ppv small{font:400 14px/20px var(--ft);color:var(--ink)}
.offv .pe-off{margin:0 auto 8px}
.hnone .pe{margin:-8px -6px -8px -8px}

/* D1…D4 (правки 10): овальная кнопка coral с Paddy в полный рост, без подписи */
.tabs.mvDx{padding:0 4px;gap:0}
.tabs.mvDx .tab{padding:0 1px;min-width:0;font-size:12px;line-height:14px}
.tabs.mvDx .tab.pdx{position:relative;flex:0 0 min(var(--pw),22%);min-width:60px;max-width:var(--pw);width:min(var(--pw),22%);height:var(--ph);padding:0;overflow:visible;justify-content:center;align-items:center;transition:background-color .18s ease,box-shadow .18s ease,translate .18s ease,transform .12s ease}
.tabs.mvDx .tab.pdx .pdb{display:block;height:var(--pf);width:calc(var(--pf)*.826);flex:none}
.tabs.mvDx .tab.pdx.on{box-shadow:0 0 0 3px var(--tabBar),0 0 0 5px var(--ink)}
.tabs.mvD1 .tab.pdx{--pw:64px;--ph:48px;--pf:42px}
.tabs.mvD2 .tab.pdx{--pw:72px;--ph:52px;--pf:48px}
.tabs.mvD2 .tab.pdx.on{box-shadow:0 0 0 2px var(--tabBar),0 0 0 5px var(--brandMango)}
.tabs.mvD3 .tab.pdx{--pw:80px;--ph:56px;--pf:66px}
.tabs.mvD3 .tab.pdx .pdb,.tabs.mvD4 .tab.pdx .pdb{position:absolute;left:50%;bottom:3px;translate:-50% 0}
.tabs.mvD4 .tab.pdx{--pw:72px;--ph:52px;--pf:60px}
.tabs.mvD4 .tab.pdx.on{translate:0 -6px;box-shadow:0 0 0 2px var(--tabBar),0 0 0 4px var(--ink),var(--shadowCoral)}
@media (prefers-reduced-motion:reduce){.tabs.mvDx .tab.pdx{transition:none}}

/* R1…R3 (правки 11): круглая главная кнопка Paddy, coral, приподнята над панелью; обводка цвета панели, без теней и свечений */
.tabs.mvRx{padding:0 4px;gap:0;position:relative;z-index:5;margin-top:var(--mt)}
.tabs.mvR1{--d:56px;--r:8px;--mt:8px}
.tabs.mvR2{--d:60px;--r:11px;--mt:13px}
.tabs.mvR3{--d:64px;--r:14px;--mt:18px}
.tabs.mvRx .tab{padding:0 1px;min-width:0;font-size:12px;line-height:14px}
.tabs.mvRx .tab.rb{position:relative;flex:0 0 calc(var(--d) + 8px);width:calc(var(--d) + 8px);height:64px;padding:0;border:0;background:none;cursor:pointer;overflow:visible;transition:none}
.tabs.mvRx .tab.rb:active{transform:none}
.tabs.mvRx .tab.rb .rbc{position:absolute;left:50%;margin-left:calc(var(--d) / -2);top:calc(32px - var(--d) / 2 - var(--r));width:var(--d);height:var(--d);border-radius:50%;background:var(--brandCoral);box-shadow:0 0 0 4px var(--tabBar);display:flex;align-items:center;justify-content:center;font-style:normal;transition:box-shadow .18s ease,transform .12s ease}
.tabs.mvRx .tab.rb .rbc svg{display:block;height:calc(var(--d) * .84);width:auto;margin-top:2px}
.tabs.mvRx .tab.rb:active .rbc{transform:scale(.94)}
.tabs.mvRx .tab.rb.on .rbc{box-shadow:0 0 0 3px var(--tabBar),0 0 0 5px var(--ink)}
.tabs.mvR2 .tab.rb.on .rbc{box-shadow:0 0 0 2px var(--tabBar),0 0 0 4px var(--ink),0 0 0 7px var(--brandMango)}
.tabs.mvR3 .tab.rb.on .rbc{box-shadow:0 0 0 3px var(--tabBar),0 0 0 6px var(--ink)}
@media (prefers-reduced-motion:reduce){.tabs.mvRx .tab.rb .rbc{transition:none}.tabs.mvRx .tab.rb:active .rbc{transform:none}}

/* ===== home-error-v1: Главная, ошибка загрузки, нет сети, спецификация «Повторить» ===== */
.i18{width:18px;height:18px}
.hh{padding:8px 16px 12px;gap:12px}
.hh .ttl h1{font:800 28px/32px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.hh .ttl h1{font-size:26px;line-height:32px}}
@media (max-width:350px){.hh .ttl h1{font-size:22px;line-height:28px}}
.hav{width:48px;height:48px;font:700 17px/20px var(--ft);border:0;padding:0}
.hs{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 16px;border-radius:999px;background:var(--surface);border:2px solid var(--lineStrong);color:var(--ink);font:700 16px/20px var(--ft);margin:0 0 12px;text-align:center}
.hs span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hclub{padding:0 16px;gap:0;margin:0 0 12px}
.hrow{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;padding:8px 0;color:var(--ink)}
.hrow+.hrow{border-top:1px solid var(--line)}
.hrow .lb{flex:1;min-width:0}
.hrow .lb b{display:block;font:700 17px/22px var(--ft)}
.hrow .lb small{display:block;font:400 14px/20px var(--ft);color:var(--inkMuted)}
.hrow>.i{color:var(--inkMuted)}
.hcta{width:100%;margin:0 0 16px}
.hcta .i{width:24px;height:24px}
.hsec{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin:0 0 4px}
.hsec h2{font:800 20px/24px var(--fd);color:var(--ink)}
.hall{min-height:48px;min-width:48px;padding:0 4px;display:flex;align-items:center;justify-content:flex-end;font:700 15px/18px var(--ft);color:var(--inkAccent)}
.pcard{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 16px 12px 12px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadowCard);margin-bottom:8px}
.dark .pcard{box-shadow:0 0 0 1px var(--line)}
.pcard .ci{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);background:var(--tintMint)}
.pcard .ci.m{background:var(--tintMango)}
.pcard .lb{flex:1;min-width:0}
.pcard .lb b{display:block;font:700 16px/20px var(--ft);color:var(--ink)}
.pcard .lb small{display:block;font:400 13px/18px var(--ft);color:var(--inkMuted)}
.pcard .lb em{display:block;font:700 13px/18px var(--ft);font-style:normal;color:var(--success)}
.pcard>.i{color:var(--inkMuted)}
/* общая плашка состояния (вместо трёх «Не удалось загрузить») */
.hplate{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadowCard);padding:24px 16px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.dark .hplate{box-shadow:0 0 0 1px var(--line)}
.hplate .pi{width:56px;height:56px;border-radius:50%;background:var(--tintMango);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.hplate .pi .i{width:28px;height:28px}
.hplate h3{font:800 18px/24px var(--fd);color:var(--ink)}
.hplate p{font:400 15px/22px var(--ft);color:var(--inkMuted);max-width:320px;margin-bottom:8px;text-wrap:balance}
.hplate .retry{width:100%;max-width:280px}
/* верхний узкий баннер «Нет подключения» */
.hbn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;background:var(--tintMango);color:var(--ink);font:700 14px/20px var(--ft);flex:none;border-bottom:1.5px solid var(--lineStrong)}
.hbn .i{width:18px;height:18px}

/* ===== единый компонент «Повторить» ===== */
.retry{min-height:48px;padding:12px 20px;gap:8px;border-radius:999px;font:700 15px/18px var(--ft);transition:transform .12s ease,background-color .18s ease}
.retry .i{width:20px;height:20px}
.retry.pri{background:var(--brandCoral);color:var(--onBrand);box-shadow:var(--shadowCoral)}
.retry:active,.retry.is-press{transform:scale(.96);box-shadow:none}
.retry.is-focus,.retry:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--focusRing)}
.retry.lg{min-height:56px}
.retry:disabled,.retry.is-load{background:var(--surfaceSunk);color:var(--inkMuted);box-shadow:none;transform:none;cursor:default}
.retry .spin{animation:rspin 1s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}

function trk(u,tot){const left=tot-u;const st=stat(u,tot);const pct=Math.max(0,Math.min(100,left/tot*100));
 return `<div class="trk ${st==='ok'?'':st}" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${left}"><i style="width:${pct}%"></i></div>`}
function bar(u,tot,date,unit){/* полоса = остаток; unit задан только для карточек с двумя полосами */
 const st=stat(u,tot);const left=tot-u;
 const cnt=esc(t('left',{u:nf(left),t:nf(tot)}))+(unit?' '+esc(unit):'');
 if(unit)return `<div class="bar stk"><b>${cnt}</b>${trk(u,tot)}<div class="rs ${st==='out'?'out':''}">${ic('clock','i14')}<span>${esc(t('reset',{d:date}))}</span></div></div>`;
 return `<div class="bar"><div class="bl"><b>${cnt}</b><span class="rs ${st==='out'?'out':''}">${esc(t('reset',{d:date}))}</span></div>${trk(u,tot)}</div>`}
function stChip(st){const m={ok:['check','st_ok'],low:['triangle-alert','st_low'],out:['circle-x','st_out']}[st];return `<span class="st ${st}">${ic(m[0],'i14')}${esc(t(m[1]))}</span>`}
function lcard(icn,tint,title,sub,bars){/* bars: [u,tot,date,unit?] */
 const sts=bars.map(b=>stat(b[0],b[1]));const worst=sts.includes('out')?'out':sts.includes('low')?'low':'ok';
 return `<div class="lc"><div class="t"><span class="ic ${tint}">${ic(icn,'i22')}</span><div class="tt"><b>${esc(title)}</b><small>${esc(sub)}</small></div>${stChip(worst)}</div>${bars.map(b=>bar(b[0],b[1],b[2],b[3])).join('')}</div>`}

 const sc=app.querySelector('.scr');if(sc)sc.scrollTop=keepScroll;
 const mg=app.querySelector('.msgs');if(mg){const top=()=>mg.firstElementChild&&mg.firstElementChild.getBoundingClientRect().top<mg.getBoundingClientRect().top-1;while(mg.children.length>1&&top())mg.removeChild(mg.firstElementChild);if(mg.firstElementChild&&mg.firstElementChild.querySelector('.tag')&&mg.children.length>1&&mg.firstElementChild.nextElementSibling&&false){}}

function setS3(k){S.s3=k;S.sheetOverride=null;const c=ST3[k];S.text=c.mode==='typing'?T.typed[LI[S.lang]]:''}
function act(a){
 const [k,...p]=a.split(':');if(k!=='how')S.how=false;
 switch(k){
 case 'panel':document.body.classList.toggle('panel-open');return;
 case 'scr':S.screen=p[0];if(WST[p[0]])S.wst=WST[p[0]][0][0];break;
 case 'st3':S.screen='3';setS3(p[0]);break;
 case 'st6':S.screen='6';S.s6=p[0];break;

/* Реакции: фиксированный набор из 6 иконок Lucide; 1 человек = 1 реакция на сообщение (повторный тап — снять, другой — сменить); в сводке до 3 типов с числом и «+N» (N = число реакций остальных типов). ДОПУЩЕНИЕ до решения менеджера мессенджера. */
const RX=[['thumbs-up','rx_up'],['heart','rx_heart'],['trophy','rx_tro'],['circle-check','rx_ok'],['flame','rx_fire'],['handshake','rx_thx']];
const RXBASE={rx_up:2,rx_heart:1,rx_tro:1,rx_ok:2};/* реакции других людей на сообщение Pau Roca */
function rxMine(){return S.rxMine===undefined?'rx_up':S.rxMine}
function rxSummary(){
 const cnt={...RXBASE};const m=rxMine();if(m)cnt[m]=(cnt[m]||0)+1;
 const all=RX.map(([i,k],ix)=>({i,k,n:cnt[k]||0,ix})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||a.ix-b.ix);
 const shown=all.slice(0,3),more=all.slice(3).reduce((a,x)=>a+x.n,0);
 const stkChip=S.rxSticker?`<button class="rx me" data-act="rxst:${S.rxSticker}" aria-pressed="true" aria-label="${esc(t('st_aria'))}">${stkSp(S.rxSticker,22)}<b>1</b></button>`:'';
 return `<div class="rxrow">${stkChip}${shown.map(x=>`<button class="rx${x.k===m?' me':''}" data-act="rxs:${x.k}" aria-pressed="${x.k===m}" aria-label="${esc(t(x.k))}">${ic(x.i,'i14')}<b>${x.n}</b></button>`).join('')}${more?`<span class="rx more" aria-label="+${more}"><b>+${more}</b></span>`:''}</div>`}
function rxRow(list){return list==='pau'?rxSummary():''}
function meta(time,own,st,ed){return `<div class="meta">${ed?`<span>${esc(t('edited'))}</span>`:''}<span>${time}</span>${own?`<span class="tkw" role="img" aria-label="${esc(tickLbl(st))}">${tick(st)}</span>`:''}</div>`}
function bub(o){/* o:{name,body,own,quote,rx,time,st,ed,tap,lp,sw} tap = короткое касание (оригинал), lp = долгое нажатие (реакции + меню) */
 const q=o.quote?`<div class="quote"><b>${esc(o.quote[0])}</b><span>${esc(o.quote[1])}</span></div>`:'';
 const inner=`${o.own?'':`<div class="nm">${esc(o.name)}</div>`}${q}${o.body}${rxRow(o.rx||[])}${meta(o.time,o.own,o.st,o.ed)}`;
 const at=(o.tap||o.lp)?`${o.tap?`data-act="${o.tap}" `:''}${o.lp?`data-lp="${o.lp}" `:''}role="button" tabindex="0"`:'';
 const b=`<div class="bub" ${at}>${inner}</div>`;
 const sw=o.sw?`<span class="swi" aria-hidden="true">${ic('reply','i22')}</span>`:'';
 return o.own?`<div class="mrow own">${b}</div>`:`<div class="mrow${o.sw?' sw':''}">${sw}${o.av||avt(o.name)}${b}</div>`}
function typingRow(n){return `<div class="mrow">${avt(n)}<div class="bub typ" role="img" aria-label="${esc(t('typing_n',{n}))}"><i></i><i></i><i></i></div></div>`}
function pinBar(act){return `<button class="pinbar" data-act="${act}"><span class="pi">${ic('pin','i22')}</span><span class="pt"><b class="ov">${esc(t('pin_lbl'))}</b><span>${esc(lt('pin_t1'))}</span></span><span class="tag pc">1/3</span></button>`}
function comp2(mode,o={}){

 const rpl=mode==='reply'?`<div class="rpl"><span class="rb"></span><div class="rt"><b>${esc(t('reply_to',{n:'Pau Roca'}))}</b><span>${esc(lt('g2'))}</span></div><button class="circ sm" data-act="wst:chat" aria-label="${esc(t('close'))}">${ic('x','i22')}</button></div>`
  :mode==='edit'?`<div class="rpl"><span class="rb"></span><div class="rt"><b>${esc(t('editing'))}</b><span>${esc(lt('g4'))}</span></div><button class="circ sm" data-act="wst:chat" aria-label="${esc(t('close'))}">${ic('x','i22')}</button></div>`:'';
 const val=mode==='edit'?lt('g4'):'';
 const right=mode==='edit'?`<button class="mic" data-act="wst:chat" aria-label="${esc(t('done'))}">${ic('check','i24')}</button>`:`<button class="plus" data-act="noop" aria-label="${esc(t('a_dict'))}">${ic('speech','i24')}</button><button class="mic" data-act="noop" aria-label="${esc(t('a_mic'))}">${ic('mic','i24')}</button>`;
 return `<div class="comp">${rpl}<div class="crow">${o.noplus?'':`<button class="plus" data-act="noop" aria-label="${esc(t('a_attach'))}">${ic('plus','i24')}</button>`}<textarea class="fld" rows="1" placeholder="${ph}" aria-label="${ph}"${o.noplus?' style="padding-left:12px"':''}>${esc(val)}</textarea>${right}</div></div>`}
function shHead(title,right){return `<div class="grab"></div><div class="sh-h"><h2 class="${disp(title).trim()}">${esc(title)}</h2>${right||''}</div>`}
function prow(icn,label,o={}){return `<button class="arowp${o.dng?' dng':''}" data-act="${o.act||'noop'}"><span class="ic">${ic(icn,'i22')}</span><span class="lb">${esc(label)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span></button>`}
function msgPrev(name,text){return `<div class="mprev"><b>${esc(name)}</b><span>${esc(text)}</span></div>`}
const STK=['hello','joy','think','oops','sport'];
const stkSp=(k,sz)=>`<span class="pst" style="width:${sz}px;height:${sz}px" aria-hidden="true">${pdSvg(pdk(k))}</span>`;
function stkBar(own){return `<div class="stkbar" role="group" aria-label="${esc(t('st_t'))}">${STK.map(k=>`<button class="stkr${S.rxSticker===k&&!own?' on':''}" data-act="${own?'wst:chat':'rxst:'+k}" aria-label="${esc(t('st_aria'))} ${k}">${stkSp(k,40)}</button>`).join('')}</div>`}
function rxBar(own){const m=own?null:rxMine();return `<div class="rxbar" role="group" aria-label="${esc(t('react_a'))}">${RX.map(([i,k])=>`<button class="rxb${k===m?' on':''}" data-act="${own?'wst:chat':'rxp:'+k}" aria-pressed="${k===m}" aria-label="${esc(t(k))}">${ic(i,'i24')}</button>`).join('')}</div>`}

function qrSvg(){let s=7,m='';const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s>>16&1};

 for(let y=0;y<25;y++)for(let x=0;x<25;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r())m+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#24123A"/>`}
 return `<svg viewBox="0 0 25 25" shape-rendering="crispEdges" aria-hidden="true">${fin(0,0)+fin(18,0)+fin(0,18)+m}</svg>`}
