 ['A','А · «⋮» в шапке'],['B','Б · «+» в поле ввода'],['C','В · карточка в чате'],['D','Г · значки на маскоте'],['cmp','Сравнение']];
const S={v:q.get('v')||'ref',st:+(q.get('st')||1),theme:q.get('theme')==='dark'?'dark':'light'};
const status=`<div class="status"><span>9:41</span><svg width="68" height="14" viewBox="0 0 68 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M26 5a9 9 0 0 1 12 0l-1.5 1.6a6.8 6.8 0 0 0-9 0zM29 8.4a5 5 0 0 1 6 0l-1.6 1.7a2.7 2.7 0 0 0-2.8 0zM32 12.4l-1.6-1.8h3.2z"/><rect x="44" y="1" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="46" y="3" width="18" height="8" rx="2"/></svg></div>`;
const hindicator='<div class="hind"></div>';
function pill(kind){
  if(kind==='laia')return `<div class="pslot"><div class="hp"><div class="av" style="background:var(--brandMint)">LF</div><div class="tx"><b>Laia Ferrer</b><small>Calonge · уровень 3,5</small></div></div></div>`;
  return `<div class="pslot"><div class="hp solo"><div class="av"><img src="assets/avatar.svg" alt=""></div><div class="tx"><b>Paddy</b></div></div></div>`;
}
const btn=(n,label,act,extra='')=>`<button class="hc ${extra}" aria-label="${label}" ${act?`data-go="${act}"`:''}>${ic(n,'i22')}</button>`;
function header(kind,right){
  return `<div class="hbar">${btn('chevron-left','Назад','','back')}${pill(kind)}${btn('house','Домой')}${right||''}</div>`;
}
function composer(plus){
  return `<div class="comp">${plus?`<button class="plusb" aria-label="Прикрепить" ${plus===true?'':`data-go="${plus}"`}>${ic('plus','i24')}</button>`:''}<div class="fld">Сообщение</div><div class="mic">${ic('mic','i22')}</div><div class="snd">${ic('arrow-up','i22')}</div></div>`;
}
const qr=`<div class="qrs"><div class="qr">Найти партнёра</div><div class="qr">Сыграть</div><div class="qr">Мой рейтинг</div></div>`;
const ptr=`<div class="ptr">Остальное — в «Что умею»</div>`;
const paddyMsg=`<div class="msg">Что хотите сделать?</div>`;
function app(inner,sheet,own){return `<div class="app">${inner}${own?'':status}${sheet||''}${own?'':hindicator}</div>`}
function sheet(kind,go){
  if(kind==='menu'||kind==='plus'){
    const head=kind==='menu'?`<div class="sh-h"><h3>Paddy</h3><button class="x" aria-label="Закрыть" data-go="1">${ic('x','i22')}</button></div>`:`<div class="sh-h" style="justify-content:flex-end"><button class="x" aria-label="Закрыть" data-go="1">${ic('x','i22')}</button></div>`;
    return `<div class="scrim" data-go="1"></div><div class="sheet"><div class="grab"></div>${head}
      <button class="sa"><span class="ic t2">${ic('layout-grid','i22')}</span><span>Что умею Paddy</span>${ic('chevron-right')}</button>
      <button class="sa"><span class="ic t3">${ic('brain','i22')}</span><span>Память Paddy</span>${ic('chevron-right')}</button>
      <button class="closeb" data-go="1">Закрыть</button></div>`;
  }
  if(kind==='what'){
    return `<div class="scrim" data-go="1"></div><div class="sheet"><div class="grab"></div><div class="sh-h"><h3>Что умею Paddy</h3><button class="x" aria-label="Закрыть" data-go="1">${ic('x','i22')}</button></div>
    ${['Найти партнёра','Сыграть','Написать в чат','Мой рейтинг','Создать игру','Правила и экраны'].map(t=>`<div class="wb">${t}</div>`).join('')}</div>`;
  }
  return '';
}
function chatPaddy(opts){
  if(opts.long)return `<div class="feed"><div class="msg own">Сыграть</div>${paddyMsg}<div class="msg own">Мой рейтинг</div>${paddyMsg}<div class="msg own">Найти партнёра</div>${paddyMsg}<div class="msg own">Сыграть</div>${paddyMsg}</div>`;
  return `<div class="feed">${paddyMsg}${qr}${opts.chips?`<div class="cc"><button class="c" data-go="${opts.chips}">${ic('layout-grid')}Что умею Paddy</button><button class="c" data-go="${opts.chips}">${ic('brain')}Память Paddy</button></div>`:ptr}</div>`;
}
function screen(){
  const {v,st}=S;
  if(v==='ref'){
    return app(`<div class="feed"><div class="msg">Отличный матч<small>9:30</small></div><div class="msg own">До новой встречи<small>9:31</small></div></div>${header('laia',btn('user','Профиль'))}${composer(true)}`);
  }
  if(v==='now'){
    return `<div class="app"><img class="nowimg" src="assets/now-${S.theme}.png" alt="Текущий чат Paddy, build 105">${hindicator}</div>`;
  }
  if(v==='A'){
    const h=header('paddy',btn('ellipsis-vertical','Меню Paddy',2));
    const hh=h.replace('<div class="pslot">',`<div class="pslot" data-go="2" style="cursor:pointer">`);
    return app(`${chatPaddy({})}${hh}${composer(false)}`,st===2?sheet('menu'):'');
  }
  if(v==='B'){
    return app(`${chatPaddy({})}${header('paddy')}${composer(2)}`,st===2?sheet('plus'):'');
  }
  if(v==='C'){
    return app(`${chatPaddy({chips:1,long:st===2})}${header('paddy')}${composer(false)}`);
  }
  if(v==='D'){
    const bg=`<img class="bgimg" src="assets/chats-${S.theme}.png" alt="Экран Чаты">`;
    const fl=`<button class="fl" style="left:12px;top:150px" data-go="2"><span class="hc" role="img" aria-label="Что умею Paddy">${ic('layout-grid','i22')}</span><small>Что умею</small></button><button class="fl" style="right:12px;top:150px" data-go="1"><span class="hc" role="img" aria-label="Память Paddy">${ic('brain','i22')}</span><small>Память</small></button>`;
    return app(`${bg}${fl}`,st===2?sheet('what'):'',true);
  }
  return '';
}
function paintStatusOverlap(){}
const STEPS={ref:[],now:[],A:['Закрыто','Меню «⋮» открыто'],B:['Закрыто','Лист «+» открыт'],C:['Начало чата','Длинная переписка: карточка уехала вверх'],D:['Экран «Чаты»','«Что умею Paddy» открыт']};
function render(){
  document.body.className=(S.theme==='dark'?'dark ':'')+(q.get('bare')?'bare':'');
  if(S.v==='cmp'){document.getElementById('root').innerHTML=topbar()+`<div class="cmpw">${window.CMP}</div>`;bind();return}
  const steps=STEPS[S.v]||[];
  document.getElementById('root').innerHTML=topbar()+`<div class="wrap"><div class="phone">${screen()}</div><div class="side">${window.NOTES[S.v]||''}</div></div>`;
  bind();
}
function topbar(){
  return `<div class="top"><h1>Шапка чата Paddy</h1>${VARS.map(([k,l])=>`<button class="chip ${S.v===k?'on':''}" data-v="${k}">${l}</button>`).join('')}<span class="sep"></span>
  ${(STEPS[S.v]||[]).map((l,i)=>`<button class="chip ${S.st===i+1?'on':''}" data-st="${i+1}">${l}</button>`).join('')}${(STEPS[S.v]||[]).length?'<span class="sep"></span>':''}
  <button class="chip ${S.theme==='light'?'on':''}" data-th="light">Светлая</button><button class="chip ${S.theme==='dark'?'on':''}" data-th="dark">Тёмная</button></div>`;
}
function bind(){
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;S.st=1;render()});
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.st=+b.dataset.st;render()});
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;render()});
  document.querySelectorAll('.phone [data-go]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const g=+b.dataset.go;S.st=g;render()});
}
window.addEventListener('DOMContentLoaded',()=>{render();document.fonts.ready.then(()=>{window.__ready=true})});
</script></body></html>
